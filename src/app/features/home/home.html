<section class="home-grid">
    <a *ngFor="let link of links"
        class="home-cards"
        [style.background-image]="'linear-gradient(rgb(42 36 29 / 25%), rgb(42 36 29 / 60%)), url(' + link.photoUrl + ')'"
        >
        <div class="overlay">
            <h3>{{ link.title }}</h3>
        </div>
    </a>
</section>

<section class="president-speech">
    <p class="pre-wrap">{{ presidentData.speech }}</p>
    <div class="polaroid">
        <img [src]="presidentData.photoUrl" alt="Photo du président" />
        <span class="legend">{{ presidentData.legend }}</span>
    </div>
</section>
